<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: lightblue;
        }
        .envelope {
            width: 300px;
            height: 200px;
            background-color: white;
            position: relative;
            margin: 50px auto;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .envelope:before {
            content: "";
            display: block;
            width: 300px;
            height: 200px;
            background-color: white;
            position: absolute;
            top: -100px;
            left: 0;
            border-radius: 20px;
            transform-origin: bottom center;
            transform: rotateX(60deg);
            box-shadow: 0 -5px 10px rgba(0,0,0,0.3);
        }
        .letter {
            width: 250px;
            height: 150px;
            background-color: white;
            position: absolute;
            top: -125px;
            left: 25px;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        .letter p {
            padding: 20px;
        }
        .envelope.open:before {
            animation-name: open-envelope-animation;
            animation-duration: 1s;
            animation-fill-mode: forwards; 
        }
        @keyframes open-envelope-animation {
          from {transform: rotateX(60deg);}
          to {transform: rotateX(-180deg);}
        }
    </style>
</head>
<body>

<div class="envelope">
    <div class="letter">
        <p>今天天气很好</p>
    </div>
</div>

<script>
    document.querySelector('.envelope').addEventListener('click', function() {
        this.classList.toggle('open');
    });
</script>

</body>
</html>
